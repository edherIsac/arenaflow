<div class="admin-players-container">
  <div class="team-admin-header">
    <h2>Administración de Jugadores</h2>
  </div>

  <div class="navigation-buttons">
    <button class="btn-back" (click)="goBack()">
      <i class="fas fa-arrow-left"></i>
      Volver
    </button>
    <button class="btn-add-player" (click)="navigateToPlayerForm()">
      <i class="fas fa-plus"></i>
      Agregar Jugador
    </button>
  </div>
  
  <div class="filters-container">
    <div class="filter-group">
      <label for="search">Buscar</label>
      <input 
        type="text" 
        id="search" 
        [(ngModel)]="searchTerm" 
        (input)="filterPlayers()" 
        placeholder="Buscar por nombre, apellido, equipo o posición..."
        class="form-control"
      >
    </div>
    
    <div class="filter-group">
      <label for="team">Equipo</label>
      <select 
        id="team" 
        [(ngModel)]="selectedTeam" 
        (change)="filterPlayers()"
        class="form-control"
      >
        <option value="">Todos los equipos</option>
        <option *ngFor="let team of teams" [value]="team">{{ team }}</option>
      </select>
    </div>
    
    <div class="filter-group">
      <label for="position">Posición</label>
      <select 
        id="position" 
        [(ngModel)]="selectedPosition" 
        (change)="filterPlayers()"
        class="form-control"
      >
        <option value="">Todas las posiciones</option>
        <option *ngFor="let position of positions" [value]="position">{{ position }}</option>
      </select>
    </div>
    
    <div class="filter-group">
      <button class="btn-clear" (click)="resetFilters()">
        <i class="fas fa-times"></i>
        Limpiar filtros
      </button>
    </div>
  </div>

  

  <div class="players-grid">
    <div *ngFor="let player of filteredPlayers" class="player-card">
      <div class="player-card-header">
        <img
          [src]="player.photo || 'assets/default-player.png'"
          alt="{{ player.name }} {{ player.lastName }}"
          class="player-avatar"
        />
        <div class="player-info">
          <h3>{{ player.name }} {{ player.lastName }}</h3>
          <p>{{ player.position }}</p>
        </div>
      </div>
      <div class="player-card-details">
        <div class="player-detail">
          <span class="label">Equipo:</span>
          <span class="value">{{ player.team }}</span>
        </div>
        <div class="player-detail">
          <span class="label">Edad:</span>
          <span class="value">{{ calculateAge(player.birthDate) }}</span>
        </div>
      </div>
      <div class="player-card-actions">
        <button class="btn-edit" (click)="editPlayer(player)">
          <i class="fas fa-edit"></i>
          Editar
        </button>
        <button class="btn-delete" (click)="deletePlayer(player)">
          <i class="fas fa-trash-alt"></i>
          Eliminar
        </button>
      </div>
    </div>
  </div>
</div>
