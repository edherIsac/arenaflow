<div class="player-profile">
  <div class="player-header">
    <div class="player-avatar">
      <img [src]="player.avatar || 'assets/images/default-avatar.png'" [alt]="player.name">
    </div>
    <div class="player-info">
      <h1 class="player-name">{{player.name}} {{player.lastName}}</h1>
      <div class="player-meta">
        <span class="badge">{{player.position}}</span>
        <span class="badge">{{player.team}}</span>
        <span class="badge">{{player.nationality}}</span>
      </div>
      <div class="player-details">
        <div class="detail-item">
          <i class="fas fa-birthday-cake"></i>
          <span>Edad: {{player.age}} años</span>
        </div>
        <div class="detail-item">
          <i class="fas fa-ruler-vertical"></i>
          <span>Altura: {{player.height}}</span>
        </div>
        <div class="detail-item">
          <i class="fas fa-weight"></i>
          <span>Peso: {{player.weight}}</span>
        </div>
      </div>
    </div>
  </div>
